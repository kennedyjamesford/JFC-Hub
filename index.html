<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#164c87"><title>JFC Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <section class="login-card">
      <img src="jfc-logo.png" class="login-logo" alt="James Ford Construction — Built for Yorkshire">
      <p class="eyebrow">JFC HUB · TEAM PORTAL</p><h1>Good morning.</h1><p class="muted">Choose your profile to continue.</p>
      <div id="teamGrid" class="team-grid"></div>
      <p class="login-note">Demo mode · Profiles and entries are stored only on this device.</p>
    </section>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar"><div class="brand"><img src="jfc-logo.png" alt="James Ford Construction"></div>
      <nav id="nav"><button class="active" data-view="home">⌂ <span>Home</span></button><button data-view="time">◷ <span>Time & timesheets</span></button><button data-view="jobs">⌑ <span>Jobs & sites</span></button><button data-view="photos">▣ <span>Site photos</span></button><button data-view="plant">⚙ <span>Plant & defects</span></button><button data-view="docs">▤ <span>RAMS & documents</span></button><button data-view="reports">▥ <span>Daily reports</span></button><button data-view="management">◫ <span>Management</span></button><button data-view="social">◎ <span>Social content</span></button></nav>
      <div class="side-foot"><button id="signOut">⇥ <span>Switch profile</span></button></div></aside>
    <main><header><button id="menu" class="icon-btn">☰</button><main><header><button id="menu" class="icon-btn">☰</button><img src="jfc-logo.png" class="header-logo" alt="James Ford Construction — Built for Yorkshire"><div><p class="eyebrow" id="headerLabel">OPERATIONS OVERVIEW</p><h2 id="pageTitle">Good morning, <span id="userName"></span></h2></div><div class="header-actions"><button class="bell">♢<b>3</b></button><button id="profileButton" class="profile"></button></div></header>
      <div id="content"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div><script src="app.js"></script>
</body></html>
